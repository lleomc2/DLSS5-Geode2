name: Build DLSS5 Geode (Android64)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          # uses the Geode version written in mod.json. If that fails for an alpha release, add:  sdk: nightly

      - name: Upload the .geode
        uses: actions/upload-artifact@v7
        with:
          name: DLSS5-Geode-Android64
          path: ${{ steps.build.outputs.build-output }}
